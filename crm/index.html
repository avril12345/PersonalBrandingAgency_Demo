<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOUD CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#/dashboard" aria-label="LOUD home">LOUD</a>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/clients" data-route="clients">Clients</a>
      <a href="#/meetings" data-route="meetings">Meetings</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
      <a href="#/mail/T1" data-route="mail">Mail <span class="nav-badge"></span></a>
      <a href="#/content" data-route="content">Content</a>
      <a href="#/visibility" data-route="visibility">Visibility</a>
      <a href="#/results" data-route="results">Results</a>
      <a href="#/invoices" data-route="invoices">Invoices <span class="nav-badge"></span></a>
      <a href="#/finance" data-route="finance">Finance</a>
    </nav>
    <div class="topbar-tools">
      <span class="demo-date" id="demo-date"></span>
      <label class="persona"><span class="sr-only">Viewing as</span><select id="persona" aria-label="Viewing as"></select></label>
      <button class="btn ghost small" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main id="app" tabindex="-1"><div class="empty">Loading…</div></main>

  <footer class="footer no-print">LOUD Personal Branding Ltd · Demo data, all clients fictional</footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="form-dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-fields" class="form-grid"></div>
      <div class="dialog-actions">
        <button type="button" class="btn danger ghost" id="dialog-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
        <button value="save" class="btn primary" id="dialog-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/finance.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views-main.js"></script>
  <script src="js/views-meetings.js"></script>
  <script src="js/views-billing.js"></script>
  <script src="js/views-mail.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
