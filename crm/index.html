<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOUD CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#/dashboard" aria-label="LOUD home">LOUD</a>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/clients" data-route="clients">Clients</a>
      <a href="#/content" data-route="content">Content</a>
      <a href="#/performance" data-route="performance">Performance</a>
      <a href="#/visibility" data-route="visibility">Visibility</a>
    </nav>
    <div class="topbar-tools">
      <span class="demo-date" id="demo-date"></span>
      <button class="btn ghost small" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
      <details class="menu">
        <summary class="btn ghost small" aria-label="More">⋯</summary>
        <div class="menu-panel">
          <button type="button" id="export-btn">Export data (JSON)</button>
          <button type="button" id="reset-btn">Reset demo data</button>
        </div>
      </details>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">LOUD · Personal branding for leaders · Demo data, all clients fictional</footer>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <dialog id="form-dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-fields" class="form-grid"></div>
      <div class="dialog-actions">
        <button type="button" class="btn danger ghost" id="dialog-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
        <button value="save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
